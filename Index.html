<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PROJECT: REPLACEMENT</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main id="game">


    <!-- ======================================
         GAME
    ======================================= -->

    <section id="game-screen">

        <div id="room">

            <div id="player"></div>

        </div>

    </section>


    <!-- ======================================
         INTERFACE
    ======================================= -->

    <section id="interface">


        <div id="health">

            <span>HEALTH</span>

            <div id="health-bar">

                <div id="health-fill"></div>

            </div>

        </div>


        <div id="round">

            ROUND
            <span id="round-number">1</span>

        </div>


        <button id="body-button">
            BODY
        </button>


    </section>


    <!-- ======================================
         BODY MENU
    ======================================= -->

    <section
        id="body-menu"
        class="hidden"
    >

        <div id="body-header">

            <h1>BODY</h1>

            <button id="close-body">
                X
            </button>

        </div>


        <div id="body-view">


            <div id="body-character">


                <button
                    id="body-head"
                    class="body-part"
                >
                    HEAD
                </button>


                <button
                    id="body-torso"
                    class="body-part"
                >
                    TORSO
                </button>


                <button
                    id="body-left-arm"
                    class="body-part"
                >
                    LEFT ARM
                </button>


                <button
                    id="body-right-arm"
                    class="body-part"
                >
                    RIGHT ARM
                </button>


                <button
                    id="body-left-leg"
                    class="body-part"
                >
                    LEFT LEG
                </button>


                <button
                    id="body-right-leg"
                    class="body-part"
                >
                    RIGHT LEG
                </button>


            </div>


            <div id="body-information">

                <h2 id="selected-part">
                    SELECT A BODY PART
                </h2>


                <p id="mutation-name">
                    No mutation selected.
                </p>


                <p id="mutation-description">
                    Click a body part to inspect it.
                </p>

            </div>


        </div>

    </section>


    <!-- ======================================
         MUTATION SELECTION
    ======================================= -->

    <section
        id="mutation-menu"
        class="hidden"
    >

        <h1>
            MUTATION AVAILABLE
        </h1>

        <p>
            CHOOSE ONE
        </p>


        <div id="mutation-options">


            <button class="mutation-option">
                UNKNOWN
            </button>


            <button class="mutation-option">
                UNKNOWN
            </button>


            <button class="mutation-option">
                UNKNOWN
            </button>


        </div>

    </section>


</main>


<!-- ======================================
     JAVASCRIPT
======================================= -->

<script src="mutations.js"></script>
<script src="player.js"></script>
<script src="enemies.js"></script>
<script src="combat.js"></script>
<script src="rounds.js"></script>
<script src="body.js"></script>
<script src="ui.js"></script>
<script src="story.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>


</body>

          </html>
